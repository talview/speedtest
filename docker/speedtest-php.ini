; The speedtest does not use the session upload progress feature, and PHP's advisory
; for CVE-2026-109619 (GHSA-6wmf-4rv5-p3rp) names it as a way to reach the
; vulnerable code path. Updating PHP is the real fix; this only removes a feature
; nothing here uses.
session.upload_progress.enabled = 0

; SRE-6671: don't send X-Powered-By: PHP/<version>. Scanners (SecurityScorecard)
; match CVEs on the banner version alone.
expose_php = Off
